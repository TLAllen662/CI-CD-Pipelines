steps:
  # Build the backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/recipe-backend', './backend']

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/recipe-backend']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      [
        'run', 'deploy', 'recipe-backend',
        '--image', 'gcr.io/$PROJECT_ID/recipe-backend',
        '--platform', 'managed',
        '--region', 'us-central1',
        '--add-cloudsql-instances', '$_CLOUDSQL_CONNECTION_NAME',
        '--set-env-vars', 'DB_CLIENT=postgres,PGHOST=/cloudsql/$_CLOUDSQL_CONNECTION_NAME,PGPORT=5432,PGDATABASE=$_PGDATABASE,PGUSER=$_PGUSER,PGPASSWORD=$_PGPASSWORD',
        '--allow-unauthenticated',
        '--port', '5000'
      ]

# Add logging configuration
options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _CLOUDSQL_CONNECTION_NAME: 'deployingtothecloud:us-central1:recipe-postgres'
  _PGDATABASE: 'recipe_app'
  _PGUSER: 'recipe_app_user'
  _PGPASSWORD: ''
